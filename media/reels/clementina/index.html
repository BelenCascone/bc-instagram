// ---------- pencil primitives ----------
function plen(pts){let L=0;for(let i=1;i<pts.length;i++)L+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);return L}

function subs(t){const c=SUBS.find(s=>t>=s.s-0.05&&t<=s.e+0.45);if(!c)return;
  const words=c.w.filter(w=>t>=w[0]).map(w=>w[1]);if(!words.length)return;
  const size=36;ctx.save();ctx.font=`700 ${size}px Type`;const maxw=880;
  const all=c.w.map(w=>w[1]);const lines=[];let ln='';all.forEach(w=>{const tt=ln?ln+' '+w:w;if(ctx.measureText(tt).width>maxw&&ln){lines.push(ln);ln=w}else ln=tt});lines.push(ln);
  const ph=lines.length*size*1.35+50,y0=1500;
  ctx.translate(J(5)*0.8,J(6)*0.8);ctx.shadowColor='rgba(0,0,0,.2)';ctx.shadowBlur=12;ctx.shadowOffsetY=6;ctx.fillStyle='#f8f7f1';ctx.fillRect(70,y0,940,ph);ctx.shadowColor='transparent';
  ctx.fillStyle=YEL;ctx.globalAlpha=.55;ctx.fillRect(470,y0-14,140,28);ctx.globalAlpha=1;
  // print only the spoken part
  let shown=words.length,k=0;ctx.fillStyle=GR;ctx.textBaseline='alphabetic';
  lines.forEach((l,i)=>{const ws=l.split(' ');let s='';ws.forEach(w=>{if(k<shown)s+=(s?' ':'')+w;k++});const lw=ctx.measureText(l).width;ctx.fillText(s,540-lw/2,y0+42+size*0.9+i*size*1.35)});
  ctx.restore()}

function seek(t){BF=Math.floor(t*12);SID=0;
  ctx.globalAlpha=1;ctx.drawImage(paper,(BF%3)-1,((BF>>1)%3)-1);
  if(t<OFF)sHook(t);else{const u=t-OFF;const s=SC.find(s=>u>=s[0]&&u<s[1])||SC[SC.length-1];s[2](u)}
  subs(t);
}
window.ready=fetch('subs.json').then(r=>r.json()).then(j=>{SUBS=j;return Promise.all(['700 40px Hand','400 40px Hand','400 40px Type','700 40px Type'].map(f=>document.fonts.load(f)))}).then(()=>{seek(0);return true});
window.seek=seek;
</script></body></html>
