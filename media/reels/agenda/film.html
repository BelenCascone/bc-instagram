function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function font(ctx,sz,wt=500,fam='Geist',stretch){ctx.font=`${wt} ${sz}px ${fam}`; const KW=[[62.5,'extra-condensed'],[75,'condensed'],[87.5,'semi-condensed'],[100,'normal'],[112.5,'semi-expanded'],[125,'expanded']];let v=stretch?parseFloat(stretch):100;let best=KW[0];KW.forEach(k=>{if(Math.abs(k[0]-v)<Math.abs(best[0]-v))best=k});ctx.fontStretch=best[1]}
function paperBg(ctx,col=CREMA){ctx.fillStyle=col;ctx.fillRect(0,0,W,H);
  // grano sutil
  const id=ctx.getImageData(0,0,W,H),d=id.data;let s=7;

function cursor(ctx,x,y,sc=1.6,press=0){ctx.save();ctx.translate(x,y);ctx.scale(sc*(1-press*.12),sc*(1-press*.12));

// ---------- vidrio líquido: desplazamiento por píxel sobre un clon de la escena ----------
function sdRR(px,py,x,y,w,h,r){const cx=x+w/2,cy=y+h/2;const qx=Math.abs(px-cx)-(w/2-r),qy=Math.abs(py-cy)-(h/2-r);
  return Math.hypot(Math.max(qx,0),Math.max(qy,0))+Math.min(Math.max(qx,qy),0)-r}
function glass(ctx,scene,x,y,w,h,r,{bevel=46,str=38,tint='rgba(255,255,255,0.16)',dark=false}={}){
  x=Math.round(x);y=Math.round(y);w=Math.round(w);h=Math.round(h);
  const SW=scene.width,SH=scene.height;const sc=scene.getContext('2d',{willReadFrequently:true}).getImageData(0,0,SW,SH).data;
  const out=ctx.getImageData(x,y,w,h),o=out.data;
  const scales=[1.0,1.07,1.15];
  for(let j=0;j<h;j++)for(let i=0;i<w;i++){
    const px=x+i,py=y+j;const d=sdRR(px,py,x,y,w,h,r);if(d>0)continue;
    const depth=-d;let k=4*(j*w+i);
    let mag=depth<bevel?Math.pow(1-depth/bevel,2.2)*str:0;
    const e=1.2;const nx=sdRR(px+e,py,x,y,w,h,r)-sdRR(px-e,py,x,y,w,h,r),ny=sdRR(px,py+e,x,y,w,h,r)-sdRR(px,py-e,x,y,w,h,r);
    const nl=Math.hypot(nx,ny)||1;
    for(let c=0;c<3;c++){const m=mag*scales[c];
      let sx=Math.round(px+nx/nl*m*1.0- (px-(x+w/2))*0.04),sy=Math.round(py+ny/nl*m- (py-(y+h/2))*0.04);
      sx=Math.min(SW-1,Math.max(0,sx));sy=Math.min(SH-1,Math.max(0,sy));o[k+c]=sc[4*(sy*SW+sx)+c];}
    o[k+3]=255;}
  ctx.putImageData(out,x,y);
  ctx.save();rr(ctx,x,y,w,h,r);ctx.clip();ctx.fillStyle=tint;ctx.fillRect(x,y,w,h);
  // brillo superior
  const g=ctx.createLinearGradient(0,y,0,y+h);g.addColorStop(0,'rgba(255,255,255,.35)');g.addColorStop(.25,'rgba(255,255,255,0)');ctx.fillStyle=g;ctx.fillRect(x,y,w,h);ctx.restore();
  // luz de borde
  ctx.save();rr(ctx,x+1,y+1,w-2,h-2,r);const lg=ctx.createLinearGradient(x,y,x+w,y+h);
  lg.addColorStop(0,'rgba(255,255,255,.95)');lg.addColorStop(.45,'rgba(255,255,255,.15)');lg.addColorStop(.55,'rgba(255,255,255,.1)');lg.addColorStop(1,'rgba(255,255,255,.75)');
  ctx.strokeStyle=lg;ctx.lineWidth=2.5;ctx.stroke();
  rr(ctx,x,y,w,h,r);ctx.strokeStyle='rgba(0,0,0,.10)';ctx.lineWidth=1;ctx.stroke();ctx.restore();
}

  rr(ctx,x-18,y-18,w+36,h+36,r+18);ctx.strokeStyle='#3a3d3a';ctx.lineWidth=3;ctx.stroke();
  const iw=island?island.w:w*0.3,ih=island?island.h:w*0.085;

}

function bubble(ctx,x,y,maxW,text,mine,{sz=31,ai=false,time='10:03'}={}){

  const bx=mine?x-bw:x;rr(ctx,bx,y,bw,bh,30);ctx.fillStyle=mine?VERDE:'#fff';ctx.shadowColor='rgba(0,0,0,.06)';ctx.shadowBlur=6;ctx.shadowOffsetY=2;ctx.fill();ctx.shadowColor='transparent';
  ctx.fillStyle=mine?CREMA:GR;ctx.textBaseline='alphabetic';lines.forEach((l,i)=>ctx.fillText(l,bx+28,y+28+sz+i*sz*1.32));
  font(ctx,20,500);ctx.fillStyle=mine?'rgba(251,248,230,.65)':GRIS;ctx.textAlign='right';ctx.fillText(time+(mine?'  ✓✓':''),bx+bw-24,y+bh-16);ctx.textAlign='left';

  return bh}

// ---------- agenda dibujada ----------
function seeded(n){let s=n*9301+49297;return()=>{s=(s*16807)%2147483647;return s/2147483647}}
function pencilLine(ctx,x1,y1,x2,y2,seed,{c=GR,w=3,a=1}={}){const r=seeded(seed);ctx.save();ctx.strokeStyle=c;ctx.globalAlpha=a;ctx.lineCap='round';
  for(let p=0;p<2;p++){ctx.lineWidth=w*(p?0.6:1);ctx.beginPath();const n=8;for(let i=0;i<=n;i++){const t=i/n;const px=x1+(x2-x1)*t+(r()-.5)*2.2,py=y1+(y2-y1)*t+(r()-.5)*2.2;i?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.stroke()}ctx.restore()}
function marker(ctx,x,y,w,h,seed){const r=seeded(seed);ctx.save();ctx.globalAlpha=.85;ctx.fillStyle=LIMA;ctx.beginPath();
  ctx.moveTo(x+r()*6,y+r()*5);ctx.lineTo(x+w-r()*6,y+r()*4);ctx.lineTo(x+w+r()*4,y+h-r()*5);ctx.lineTo(x-r()*3,y+h+r()*3);ctx.closePath();ctx.fill();ctx.restore()}
function hand(ctx,s,x,y,sz,{c=GR,wt=700,prog=1}={}){font(ctx,sz,wt,'Gaegu');ctx.fillStyle=c;ctx.textBaseline='alphabetic';
  const n=Math.floor(s.length*prog);ctx.fillText(s.slice(0,n),x,y);return x+ctx.measureText(s.slice(0,n)).width}
const DAYS=['Lun 16','Mar 17','Mié 18','Jue 19','Vie 20'];
const TURNOS=[[0,0,'Juan','10:30'],[1,2,'Marta','16:00'],[0,3,'Sofi','17:00'],[2,1,'Pablo','11:00'],[3,0,'Lu','10:00'],[3,3,'Ana','16:30'],[4,2,'Vero','15:00'],[1,0,'Raúl','09:30'],[2,3,'Nico','17:30'],[4,1,'Carlos','12:00']];
function agenda(ctx,x,y,w,h,{done=10,partial=0.6,seedBase=1,paper=true}={}){
  if(paper){ctx.fillStyle='#fffdf3';ctx.fillRect(x,y,w,h)}
  hand(ctx,'Semana 16 – 20 nov',x+40,y+86,58);
  pencilLine(ctx,x+40,y+108,x+420,y+112,seedBase+3,{w:3.5});
  const gx=x+40,gy=y+150,gw=w-80,gh=h-190,cw=gw/5,rh=gh/4;
  for(let i=0;i<=5;i++)pencilLine(ctx,gx+i*cw,gy,gx+i*cw,gy+gh,seedBase+10+i,{c:GRIS,w:2.4,a:.9});
  for(let j=0;j<=4;j++)pencilLine(ctx,gx,gy+j*rh,gx+gw,gy+j*rh,seedBase+20+j,{c:GRIS,w:2.4,a:.9});
  DAYS.forEach((d,i)=>hand(ctx,d,gx+i*cw+16,gy-14,34,{c:VERDE}));
  TURNOS.forEach((t,k)=>{if(k>done)return;const p=k===done?partial:1;const cx=gx+t[0]*cw,cy=gy+t[1]*rh;
    if(p>0.3)marker(ctx,cx+12,cy+rh*0.2,Math.min(cw-24,(cw-24)*Math.min(1,(p-.3)/.5)),rh*0.26,seedBase+50+k);
    hand(ctx,t[3],cx+18,cy+rh*0.4,36,{prog:Math.min(1,p*2)});
    hand(ctx,t[2],cx+18,cy+rh*0.78,40,{wt:400,prog:Math.max(0,p*2-1)});
  });
  return {gx,gy,cw,rh};
}

function wordmark(ctx,cx,cy,{sq=0,size=230,word='agendá'}={}){
  // cada letra se acerca al punto con el mismo factor y se angosta (wdth)
  const stretch=125-sq*60;font(ctx,size,800,'Archivo',stretch+'%');ctx.fillStyle=GR;ctx.textBaseline='alphabetic';
  const widths=[...word].map(ch=>ctx.measureText(ch).width);const total=widths.reduce((a,b)=>a+b,0);
  const dotR=size*0.11;const full=total+dotR*2.6;let x=cx-full/2;const dotX=x+total+dotR*1.5;
  const fac=1-sq;let acc=0;[...word].forEach((ch,i)=>{const lx=x+acc;const nx=dotX-(dotX-lx)*fac;ctx.save();ctx.translate(nx,cy);ctx.scale(fac,1);ctx.fillText(ch,0,0);ctx.restore();acc+=widths[i]});
  return {dotX,dotY:cy-dotR,dotR};
}

  const r=seeded(42);for(let s=0;s<3;s++){const bx=780+s*90,by=200+s*60;ctx.save();ctx.translate(bx,by);
    for(let i=0;i<9;i++){const a=-1.2+i*0.34+(r()-.5)*.2,L=260+r()*200;ctx.save();ctx.rotate(a);ctx.beginPath();ctx.ellipse(L/2,0,L/2,34+r()*18,0,0,7);ctx.fill();ctx.restore()}
    ctx.lineWidth=10;ctx.strokeStyle='rgba(27,67,50,.16)';ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(-60,500,-120,1100);ctx.stroke();ctx.restore()}

// ================== AGENDÁ · film 27 s, 120 BPM, 54 beats ==================
const DUR=27, PX=90, PY=160, PW=900, PH=1640, PR=144, CY=H/2;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));

function ease(t,t0,t1){const u=clamp((t-t0)/(t1-t0));return u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2}
function eout(t,t0,t1){const u=clamp((t-t0)/(t1-t0));return 1-Math.pow(1-u,3)}
// resorte cerrado (respuesta al escalón): función pura del tiempo
function sp(t,t0,w=15,z=0.55){const u=t-t0;if(u<=0)return 0;const wd=w*Math.sqrt(1-z*z);return 1-Math.exp(-z*w*u)*(Math.cos(wd*u)+z*w/wd*Math.sin(wd*u))}

// ---------- iris de 6 hojas ----------
function iris(cx,cy,R,a,rot){ // a: 1 abierto, 0 cerrado
  const ap=R*a*1.02;X.save();X.beginPath();X.arc(cx,cy,R,0,7);X.clip();
  for(let i=0;i<6;i++){const th=rot+i*Math.PI/3;
    // vértices del hexágono de apertura
    const v1=[cx+ap*Math.cos(th),cy+ap*Math.sin(th)],v2=[cx+ap*Math.cos(th+Math.PI/3),cy+ap*Math.sin(th+Math.PI/3)];
    const dx=v2[0]-v1[0],dy=v2[1]-v1[1];const L=Math.hypot(dx,dy)||1;const ux=dx/L,uy=dy/L;const nx=-uy,ny=ux; // normal hacia afuera
    X.beginPath();X.moveTo(v1[0]-ux*R*2,v1[1]-uy*R*2);X.lineTo(v2[0]+ux*0.01,v2[1]+uy*0.01);
    X.lineTo(v2[0]+ux*0.01+(-nx)*-R*2.2,v2[1]+uy*0.01+(-ny)*-R*2.2);X.lineTo(v1[0]-ux*R*2+(-nx)*-R*2.2,v1[1]-uy*R*2+(-ny)*-R*2.2);X.closePath();
    X.fillStyle=i%2?'#1a1c1a':'#232623';X.fill();X.strokeStyle='rgba(251,248,230,.18)';X.lineWidth=2;X.stroke()}
  X.restore()}

        X.save();rr(X,g[0],g[1],g[2],g[3],g[4]);X.clip();X.drawImage(PHC,PX,PY);X.restore();
        rr(X,g[0],g[1],g[2],g[3],g[4]);X.strokeStyle=GR;X.lineWidth=8*(1-bez);X.stroke();
        if(bez>0){const is=sp(t,4.05,16,0.6);X.save();X.translate(W/2,PY+62);X.scale(is,is);rr(X,-110,-32,220,64,32);X.fillStyle='#000';X.fill();X.restore()}
      }
    }
  }
  // ----- B/C. CAOS + IA (4.4–12.9 s) con el teléfono -----
  else if(t<13.0){
    phoneContent(CT);
    // cámara: zoom suave hacia la notificación al hacer click y alejamiento final
    const back=ease(t,12.0,12.8);const s=lerp(1,0.34,back);const cy=lerp(PY+PH/2,1320+PH*0.34/2,back);
    const I=drawPhone(t,s,W/2,cy);drawIsland(I);
  }
  // ----- D/E. AGENDA + ESTADOS (13–22.6 s) -----
  else if(t<22.7){
    phoneContent(t);const s=0.34;const sink=sp(t,18.6,9,0.9);const pcy=1320+PH*s/2+sink*700;
    // la ventana nace de la isla
    const stretch=sp(t,13.0,10,0.75),pinch=ease(t,13.35,13.6),roll=ease(t,13.75,14.35);
    const I0={ix:W/2,iy:1320+(30+32)*s,iw:220*s,ih:64*s};
    // agenda (y título escrito)
    const fall=ease(t,18.6,19.3);
    X.save();X.translate(W/2,WIN.y);X.scale(lerp(1,0.92,fall),lerp(1,0.92,fall));X.translate(-W/2,-WIN.y);
    if(t>=13.55){
      const wr=agendaWindow(t,roll);
      // lápiz que escribe el turno actual
      if(wr.k>=0&&wr.k<10&&t<18.6){const tt=TURNOS[wr.k];const cx=wr.g.gx+tt[0]*wr.g.cw,cy=wr.g.gy+tt[1]*wr.g.rh;
        const px=cx+18+Math.min(wr.g.cw-30,110*Math.min(1,wr.part*2)),py=cy+wr.g.rh*(wr.part<0.5?0.4:0.78)-8;pencilTool(X,px+Math.sin(t*40)*2,py,-0.95)}
      // gotitas lima que vuelan del teléfono a cada casilla
      for(let k=0;k<10;k++){const t0=14.4+k*0.4-0.3;const u=(t-t0)/0.3;if(u>0&&u<1){const tt=TURNOS[k];const ex=WIN.x+40+tt[0]*((WIN.w-80)/5)+60,ey=WIN.y+90+150+tt[1]*((WIN.h-90-190)/4)+40;
        const sx=I0.ix,sy=I0.iy;const bx=lerp(sx,ex,u),by=lerp(sy,ey,u)-Math.sin(u*Math.PI)*180;X.beginPath();X.arc(bx,by,14*(1-u*0.4),0,7);X.fillStyle=LIMA;X.fill();X.strokeStyle=GR;X.lineWidth=3;X.stroke()}}
    }
    X.restore();
    if(t>=14.4)hand(X,'la IA anota cada turno',W/2-300,190,64,{c:VERDE,prog:ease(t,14.4,15.4)});
    // teléfono chico
    const I=drawPhone(t,s,W/2,pcy);
    // isla → cuello líquido → barra de la ventana
    if(t<13.75){
      const top=rrLerp([I.ix-I.iw/2,I.iy-I.ih/2,I.iw,I.ih,I.ih/2],[WIN.x,WIN.y,WIN.w,90,40],clamp(stretch,0,1.05));
      X.fillStyle='#000';rr(X,top[0],top[1],top[2],top[3],top[4]);X.fill();
      const neck=(1-pinch)*Math.min(1,stretch*3);if(neck>0.01){const nw=lerp(6,70,neck),bot=I.iy,tp=top[1]+top[3]-2,mid=(bot+tp)/2;
        X.beginPath();X.moveTo(I.ix-I.iw/2*neck,bot);X.bezierCurveTo(I.ix-nw/2,bot-40,I.ix-nw/4,mid,I.ix-nw/2,tp);X.lineTo(I.ix+nw/2,tp);X.bezierCurveTo(I.ix+nw/4,mid,I.ix+nw/2,bot-40,I.ix+I.iw/2*neck,bot);X.closePath();X.fill()}
      drawIsland(I);
    } else drawIsland(I);
    // píldora de estados que nace de la isla
    if(t>=18.5){const pop=sp(t,18.5,12,0.6),mv=ease(t,18.6,19.2);const cx=W/2,cy=lerp(I0.iy,1500,mv);
      const r=pillState(t,cx,cy,clamp(pop,0,1.1));
      font(X,28,500);X.fillStyle=GRIS;X.textAlign='center';X.textBaseline='alphabetic';
      if(t>19.3){X.fillText('cada turno, solo, de punta a punta',W/2,1640);}X.textAlign='left';
      // inundación desde el ícono
      const fl=ease(t,22.4,22.7);if(fl>0){X.beginPath();X.arc(r.iconX||cx,cy,34+fl*2600,0,7);X.fillStyle=GR;X.fill()}
    }
  }
  // ----- F. PARED + CIERRE (22.7–27 s) -----
  else {
    X.drawImage(WALL,0,0);
    riseText('Turnos por WhatsApp,',W/2,1390,74,800,'Archivo','118%',GR,24.0,t);
    riseText('los agenda la IA.',W/2,1480,74,800,'Archivo','118%',GR,24.45,t);
    riseText('Escribinos · BC Informática',W/2,1590,32,600,'Geist',null,VERDE,24.9,t);
    // negro que se contrae abriendo un agujero desde la cinta
    const hole=ease(t,23.2,23.75);
    if(hole<1){X.save();X.beginPath();X.rect(0,0,W,H);X.moveTo(W/2+hole*2400,300);X.arc(W/2,300,hole*2400,0,7,true);X.fillStyle=GR;X.fill('evenodd');X.restore()}
    // segunda inundación y regreso al wordmark
    const f2=ease(t,25.35,25.65),con=ease(t,25.7,26.15),dot=sp(t,26.15,13,0.75),letters=ease(t,26.3,26.95);
    if(t>=25.35){
      if(t<25.7){X.beginPath();X.arc(W/2,CY,f2*1300,0,7);X.fillStyle=GR;X.fill()}
      else{
        X.drawImage(PAPER,0,0);
        if(t>=26.3)drawWord(X,1-letters,1,false);
        let g;if(t<26.15){g=rrLerp([-60,-60,W+120,H+120,0],[W/2-390,CY-75,780,150,75],con)}
        else{const d=clamp(dot,0,1.08);const r=WM.dotR;g=[lerp(W/2-390,WM.dotX-r,d),lerp(CY-75,WM.dotY-r,d),lerp(780,2*r,d),lerp(150,2*r,d),lerp(75,r,d)]}
        rr(X,g[0],g[1],Math.max(1,g[2]),Math.max(1,g[3]),Math.max(0,Math.min(g[4],g[2]/2,g[3]/2)));X.fillStyle=GR;X.fill();
      }
    }
  }
  // cursor en todas las escenas
  if(!(t>22.6&&t<25.0))drawCursor(t);
  return true;
}
// mapa de tiempo: salida (con voz) → tiempo de la película
const OUT_DUR=30.55;
const MAP=[[13.8,12.0],[16.2,14.4],[18.7,18.4],[25.2,24.9],[28.9,25.35],[30.55,27.0]];
window.seek=async function(T){T=((T%OUT_DUR)+OUT_DUR)%OUT_DUR;
  let t;FROZEN=false;
  if(T<12.0){t=T;CT=T}
  else if(T<13.8){t=11.99;CT=T}
  else{FROZEN=true;CT=13.75;let i=0;while(i<MAP.length-2&&T>MAP[i+1][0])i++;const a=MAP[i],c=MAP[i+1];t=lerp(a[1],c[1],(T-a[0])/(c[0]-a[0]))}
  seekFilm(t);return true};
window.init=async()=>{for(const f of ['800 100px Archivo','600 40px Geist','400 40px Geist','700 40px Gaegu','400 40px Gaegu'])await document.fonts.load(f);
  buildCaches();wmLayout();
  // pre-congelar el chat final para que el render por cuadros sea puro
  const keep=X.getTransform();phoneContent(13.75);CHAT_FROZEN=off(PW,PH);CHAT_FROZEN.getContext('2d').drawImage(PHC,0,0);return true};
