name: Archivos para Make
on:
  push:
    paths: ["calendario/**", "make/build.py"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 make/build.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add make/hoy
          git diff --cached --quiet || (git commit -m "Actualizar make/hoy" && git push)
