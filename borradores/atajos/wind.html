<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;background:#FBF4E9;font-family:'Inter';color:#121412;position:relative;overflow:hidden}
h1,.sub,.sub2,.tag,.foot{z-index:2}
.tag{position:absolute;top:78px;left:50%;transform:translateX(-50%);font:700 22px 'Inter';letter-spacing:5px;color:#1B4332;border:2px solid #8F9E8B;border-radius:40px;padding:10px 26px;white-space:nowrap}
h1{position:absolute;top:150px;width:100%;text-align:center;font:900 112px/1.0 'Inter Display';letter-spacing:-4px}
h1 .hl{background:#C6FF00;padding:0 18px;display:inline-block;margin-top:8px}
.keys{position:absolute;top:470px;left:0;width:100%;display:flex;justify-content:center;align-items:center;gap:46px;perspective:1400px}
.key{width:330px;height:330px;position:relative;transform:rotateX(26deg);transform-style:preserve-3d}
.cap{position:absolute;inset:0;border-radius:46px;background:linear-gradient(180deg,#B7EC00 0%,#9DCC00 100%);box-shadow:0 34px 0 #6E8F00,0 36px 2px #5C7800,0 70px 60px rgba(40,50,0,.35),0 120px 90px rgba(0,0,0,.18)}
.top{position:absolute;left:30px;right:30px;top:20px;bottom:44px;border-radius:34px;background:radial-gradient(ellipse at 40% 25%,#E2FF6A 0%,#CFFF1F 35%,#BDF000 75%,#AEDF00 100%);box-shadow:inset 0 3px 2px rgba(255,255,255,.6),inset 0 -6px 12px rgba(80,100,0,.35);display:flex;align-items:center;justify-content:center;gap:22px}
.lbl{font:700 92px 'Inter';color:#1d2410;letter-spacing:-2px;text-shadow:0 1px 0 rgba(255,255,255,.35)}
.win{display:grid;grid-template-columns:38px 38px;gap:6px}
.win i{width:38px;height:38px;background:#1d2410;display:block;border-radius:3px}
.plus{font:800 110px 'Inter';color:#1B4332;margin-top:-30px}
.sub{position:absolute;top:930px;width:100%;text-align:center;font:600 40px/1.3 'Inter';color:#121412;padding:0 60px}
.sub2{position:absolute;top:1050px;width:100%;text-align:center;font:500 27px/1.35 'Inter';color:#4f5a4d;padding:0 170px}
.foto{position:absolute;left:0;top:405px;width:1080px;z-index:0;-webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 12%,#000 88%,transparent 100%)}
.foot{position:absolute;bottom:52px;width:100%;display:flex;flex-direction:column;align-items:center;gap:10px}
.foot img{height:58px}
.foot span{font:500 24px 'Inter';color:#1B4332}
</style></head><body>
<div class="tag">ATAJOS DE WINDOWS · 06</div>
<h1>VENTANAS<br><span class="hl">AFUERA.</span></h1>
<img class="foto" src="teclas_wind.png">
<div class="sub">Minimiza todo y te deja en el escritorio<br>en un segundo.</div>
<div class="sub2">Apretalo de nuevo y vuelve todo<br>como estaba.</div>
<div class="foot"><img src="logo.png"><span>@bc.informatica.pna</span></div>
</body></html>
